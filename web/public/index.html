<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Dataset Intake Assistant</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f4f8;color:#243746;max-width:800px;margin:30px auto;padding:16px}
.card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 4px 18px #0001}.msg{padding:13px 16px;margin:12px 0;border-radius:10px;line-height:1.5}.bot{background:#e8f4f8}.user{background:#27ae60;color:#fff;margin-left:15%;text-align:right}
textarea{width:100%;height:76px;box-sizing:border-box;padding:12px;font-size:15px;border-radius:8px;border:1px solid #bbb}button{background:#2980b9;color:#fff;border:0;border-radius:8px;padding:11px 17px;margin-top:8px;cursor:pointer}.option{margin:5px}.small{font-size:12px;color:#667}
</style>
</head>
<body><div class="card">
<h2>AI Dataset Intake Assistant</h2>
<p class="small">Educational dataset exploration only. Not a diagnosis or treatment recommendation.</p>
<div id="chat"></div>
<div id="input"><textarea id="text" placeholder="Describe your symptoms or question..."></textarea><br><button onclick="send()">Send</button></div>
</div>
<script>
const chat=document.getElementById("chat"), input=document.getElementById("text");
let state={history:[],answers:[],turn:0};

function msg(html,who="bot"){const d=document.createElement("div");d.className="msg "+who;d.innerHTML=html;chat.appendChild(d);window.scrollTo(0,document.body.scrollHeight)}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
async function send(answer){
  const text=(answer ?? input.value).trim(); if(!text)return;
  msg(esc(text),"user"); input.value="";
  const old=document.querySelectorAll(".options"); old.forEach(x=>x.remove());
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text,state})});
    const data=await r.json(); if(!r.ok) throw new Error(data.error||"Request failed");
    state=data.state;
    if(data.type==="question"){
      msg("<b>Assistant:</b> "+esc(data.question));
      const box=document.createElement("div");box.className="msg bot options";
      (data.options||[]).forEach(o=>{const b=document.createElement("button");b.className="option";b.textContent=o;b.onclick=()=>send(o);box.appendChild(b)});
      chat.appendChild(box);
    } else {
      msg("<b>Dataset matches:</b><br>"+(data.results||[]).map((x,i)=>`<p><b>${i+1}. ${esc(x.product_name||"Unnamed entry")}</b><br>${esc(x.indications||"").slice(0,240)}</p>`).join(""));
      msg("This is a dataset match, not a medical diagnosis or prescription. For concerning, severe, or worsening symptoms, seek qualified medical care.");
    }
  }catch(e){msg("<b>Error:</b> "+esc(e.message))}
}
msg("<b>Assistant:</b> Describe your symptoms or ask a question. I will use the dataset and ask one useful follow-up question at a time.");
</script></body></html>
